name: Repocast

options:
  bundleIdPrefix: au.com.bclgapps
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  defaultConfig: Release
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: XKV3A3SLX9

# Firebase Analytics is the only third-party SDK / network dependency. SPM
# resolves the transitive GoogleAppMeasurement binary automatically.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  Repocast:
    type: application
    platform: iOS
    sources:
      - path: Sources/Repocast
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
    resources:
      - path: Sources/Repocast/Resources
    info:
      path: Sources/Repocast/Info.plist
      properties:
        CFBundleDisplayName: Repocast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # Keep audio playing when the screen locks / the app backgrounds —
        # required for car + exercise listening.
        UIBackgroundModes:
          - audio
        # Voice notes: recorded with the mic, transcribed on-device.
        NSMicrophoneUsageDescription: Repocast uses the microphone to record your voice notes.
        NSSpeechRecognitionUsageDescription: Voice notes are transcribed to text on this device — the audio never leaves your iPhone.
        # CarPlay attaches as a second scene while the phone UI runs, so
        # multiple scenes must be on (side effect: iPad gains multi-window).
        # Only the CarPlay role is configured — SwiftUI keeps handling the
        # main window scene via its default configuration.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UILaunchScreen:
          {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.bclgapps.Repocast
        CODE_SIGN_STYLE: Automatic
        # CarPlay Audio. Apple granted the entitlement for this account
        # (2026-08-18), so it now applies to every build. If device signing
        # complains that the profile lacks the capability, enable "CarPlay
        # Audio App" on the au.com.bclgapps.Repocast identifier under
        # developer.apple.com ▸ Identifiers ▸ Additional Capabilities, then
        # rebuild. The .entitlements file is checked in (hand-edited, not
        # XcodeGen-generated).
        CODE_SIGN_ENTITLEMENTS: Sources/Repocast/Repocast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
    scheme:
      testTargets:
        - RepocastTests
        - RepocastUITests
      gatherCoverageData: true

  RepocastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RepocastTests
        excludes:
          - "**/.DS_Store"
      # Narration-package fixtures: a folder reference copied verbatim into the
      # test bundle so per-package subfolders survive intact.
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Repocast
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: au.com.bclgapps.RepocastTests

  RepocastUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/RepocastUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Repocast
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: au.com.bclgapps.RepocastUITests

configs:
  Debug: debug
  Release: release

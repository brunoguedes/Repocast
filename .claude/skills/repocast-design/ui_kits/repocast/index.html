<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font-text); background: var(--bg-secondary); display: flex; align-items: center; justify-content: center; }
  .rc-phone {
    position: relative; width: 390px; height: 844px; overflow: hidden;
    background: var(--bg-grouped); display: flex; flex-direction: column;
    font-family: var(--font-text); color: var(--text-primary);
  }
  .rc-statusbar { height: 50px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 28px 0 32px; }
  .rc-time { font: var(--type-subheadline); font-weight: 600; }
  .rc-status-icons { display: flex; align-items: center; gap: 6px; color: var(--text-primary); }
  .rc-screen { flex: 1; min-height: 0; position: relative; }
  .rc-bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; }

  /* Sheets */
  .rc-scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.28); opacity: 0; pointer-events: none; transition: opacity var(--duration-base) var(--ease-out); z-index: 10; }
  .rc-scrim.show { opacity: 1; pointer-events: auto; }
  .rc-sheet {
    position: absolute; left: 0; right: 0; bottom: 0; height: 92%;
    background: var(--bg); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
    box-shadow: var(--shadow-sheet); overflow: hidden; z-index: 11;
    transform: translateY(102%); transition: transform var(--duration-base) var(--ease-standard);
  }
  .rc-sheet-full { height: 100%; border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; }
  .rc-sheet.up { transform: translateY(0); }

  /* Spinner + pulse */
  .rc-spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--fill); border-top-color: var(--tint); animation: rc-spin 0.8s linear infinite; }
  @keyframes rc-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: no-preference) {
    .rc-pulse { animation: rc-pulse 2.4s var(--ease-out) infinite; }
  }
  @keyframes rc-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }

  .rc-screen ::-webkit-scrollbar { width: 0; height: 0; }
</style>

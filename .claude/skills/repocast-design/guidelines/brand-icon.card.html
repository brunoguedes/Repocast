<!-- @dsCard group="Brand" viewport="700x230" name="App Icon" subtitle="System-blue waveform mark — iOS rounded-rect mask applied" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--bg); color: var(--text-primary); }
  .wrap { display: flex; align-items: center; gap: 28px; padding: 24px 28px; }
  .icon { width: 160px; height: 160px; border-radius: 36px; box-shadow: var(--shadow-md); flex: none; }
  .meta { display: flex; flex-direction: column; gap: 6px; }
  .name { font: var(--type-title-3); }
  .desc { font: var(--type-subheadline); color: var(--text-secondary); max-width: 320px; }
  .spec { font: var(--type-caption-1); font-family: var(--font-mono); color: var(--text-tertiary); margin-top: 4px; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="icon" src="../assets/repocast-icon-1024.png" alt="Repocast app icon" />
    <div class="meta">
      <span class="name">Repocast</span>
      <span class="desc">Five rounded waveform bars in white on a system-blue gradient — the app's signature glyph.</span>
      <span class="spec">1024×1024 · full-bleed · no alpha</span>
    </div>
  </div>
</body>
</html>

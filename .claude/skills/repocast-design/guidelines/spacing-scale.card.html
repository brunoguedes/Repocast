<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="8pt grid with 4pt half-steps" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--bg); color: var(--text-primary); }
  .wrap { padding: 20px 24px; display: flex; gap: 14px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--tint); border-radius: 3px; width: 100%; }
  .box { display: flex; align-items: flex-end; }
  .lbl { font: var(--type-caption-2); font-family: var(--font-mono); color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="box"><div class="bar" style="width:4px;height:4px"></div></div><span class="lbl">2</span></div>
    <div class="col"><div class="box"><div class="bar" style="width:8px;height:8px"></div></div><span class="lbl">4</span></div>
    <div class="col"><div class="box"><div class="bar" style="width:14px;height:14px"></div></div><span class="lbl">8</span></div>
    <div class="col"><div class="box"><div class="bar" style="width:20px;height:20px"></div></div><span class="lbl">12</span></div>
    <div class="col"><div class="box"><div class="bar" style="width:28px;height:28px"></div></div><span class="lbl">16</span></div>
    <div class="col"><div class="box"><div class="bar" style="width:36px;height:36px"></div></div><span class="lbl">20</span></div>
    <div class="col"><div class="box"><div class="bar" style="width:44px;height:44px"></div></div><span class="lbl">24</span></div>
    <div class="col"><div class="box"><div class="bar" style="width:56px;height:56px"></div></div><span class="lbl">32</span></div>
    <div class="col"><div class="box"><div class="bar" style="width:78px;height:78px"></div></div><span class="lbl">44</span></div>
  </div>
</body>
</html>

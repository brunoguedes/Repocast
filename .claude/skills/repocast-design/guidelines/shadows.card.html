<!-- @dsCard group="Materials & Motion" viewport="700x150" name="Shadows" subtitle="Soft and sparse — only for floating surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--bg-secondary); color: var(--text-primary); }
  .wrap { padding: 28px 24px; display: flex; gap: 28px; align-items: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 130px; height: 70px; background: var(--bg); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font: var(--type-caption-1); color: var(--text-secondary); }
  .lbl { font: var(--type-caption-2); font-family: var(--font-mono); color: var(--text-tertiary); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)">card</div><span class="lbl">shadow-sm</span></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-md)">elevated</div><span class="lbl">shadow-md</span></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)">popover</div><span class="lbl">shadow-lg</span></div>
  </div>
</body>
</html>

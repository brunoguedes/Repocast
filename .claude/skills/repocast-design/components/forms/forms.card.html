<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--bg-secondary); color: var(--text-primary); }
  #root { padding: 22px 24px; }
  .group { margin-bottom: 20px; }
  .ttl { font: var(--type-caption-1); font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 10px; }
  .rowx { display: flex; align-items: center; gap: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Toggle, Slider, SegmentedControl, TextField } = window.RepocastDesignSystem_a3bb12;

  function Demo() {
    const [on, setOn] = React.useState(true);
    const [on2, setOn2] = React.useState(false);
    const [rate, setRate] = React.useState(0.6);
    const [speed, setSpeed] = React.useState(1);
    const [title, setTitle] = React.useState("");
    return (
      <div>
        <div className="group">
          <p className="ttl">Toggle</p>
          <div className="rowx"><Toggle checked={on} onChange={setOn} /><Toggle checked={on2} onChange={setOn2} /><Toggle checked={true} disabled /></div>
        </div>
        <div className="group">
          <p className="ttl">Slider — speech rate</p>
          <Slider value={rate} min={0} max={1} onChange={setRate} minIcon="turtle" maxIcon="rabbit" />
        </div>
        <div className="group">
          <p className="ttl">Segmented — playback speed</p>
          <SegmentedControl value={speed} onChange={setSpeed} options={[
            { label: "0.75×", value: 0.75 }, { label: "1×", value: 1 },
            { label: "1.25×", value: 1.25 }, { label: "1.5×", value: 1.5 }, { label: "2×", value: 2 },
          ]} />
        </div>
        <div className="group">
          <p className="ttl">Text field</p>
          <TextField value={title} onChange={setTitle} placeholder="Optional title" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  setTimeout(() => window.lucide && window.lucide.createIcons(), 60);
</script>
</body>
</html>

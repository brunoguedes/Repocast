<head>

<style>
  body { margin: 0; font-family: var(--font-text); background: var(--bg-secondary); color: var(--text-primary); }
  #root { padding: 22px 24px; max-width: 460px; }
</style>

<body>
<div id="root"></div>
<script type="text/babel">
  const { Card, ListRow, SectionHeader, Toggle, Badge } = window.RepocastDesignSystem_a3bb12;
  function Demo() {
    const [on, setOn] = React.useState(true);
    return (
      <div>
        <SectionHeader>Settings</SectionHeader>
        <Card variant="grouped">
          <ListRow icon="mic" iconBg="var(--purple)" title="Voice" value="System Default" accessory="disclosure" onClick={()=>{}} />

          <ListRow icon="sparkles" iconBg="var(--green)" title="Apple Intelligence" trailing={<Toggle checked={on} onChange={setOn} />} last />
        </Card>
        <div style={{height:18}} />
        <SectionHeader>Tracks</SectionHeader>
        <Card variant="grouped">
          <ListRow icon="audio-lines" title="README.md" subtitle="12:48" trailing={<Badge tint="green">Ready</Badge>} onClick={()=>{}} />
          <ListRow icon="hourglass" iconColor="var(--orange)" title="DataStack.swift" subtitle="Generating…" onClick={()=>{}} />
          <ListRow title="Delete All" destructive last onClick={()=>{}} />
        </Card>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  setTimeout(() => window.lucide && window.lucide.createIcons(), 60);
</script>

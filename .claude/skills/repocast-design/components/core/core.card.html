<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--bg-secondary); color: var(--text-primary); }
  #root { padding: 22px 24px; }
  .group { margin-bottom: 18px; }
  .ttl { font: var(--type-caption-1); font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton, Badge, Card } = window.RepocastDesignSystem_a3bb12;

  function Demo() {
    return (
      <div>
        <div className="group">
          <p className="ttl">Button — prominence</p>
          <div className="row">
            <Button variant="filled">Generate</Button>
            <Button variant="tinted" icon="circle-play">Play All</Button>
            <Button variant="gray">Cancel</Button>
            <Button variant="plain">Skip</Button>
            <Button variant="destructive" icon="trash-2">Delete</Button>
          </div>
        </div>
        <div className="group">
          <p className="ttl">Button — size · shape · state</p>
          <div className="row">
            <Button size="small">Small</Button>
            <Button size="medium">Medium</Button>
            <Button size="large">Large</Button>
            <Button shape="capsule" variant="tinted">Capsule</Button>
            <Button disabled>Disabled</Button>
          </div>
        </div>
        <div className="group">
          <p className="ttl">IconButton — transport</p>
          <div className="row">
            <IconButton icon="skip-back" label="Previous" />
            <IconButton icon="play" prominence="filled" size="large" label="Play" />
            <IconButton icon="skip-forward" label="Next" />
            <IconButton icon="plus" prominence="tinted" label="New" />
            <IconButton icon="settings" prominence="gray" label="Settings" />
          </div>
        </div>
        <div className="group">
          <p className="ttl">Badge — track status</p>
          <div className="row">
            <Badge tint="green" icon="check">Ready</Badge>
            <Badge tint="orange" icon="hourglass">Generating</Badge>
            <Badge tint="red" variant="solid" icon="triangle-alert">Failed</Badge>
            <Badge tint="blue">Markdown</Badge>
            <Badge tint="purple">Code</Badge>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  setTimeout(() => window.lucide && window.lucide.createIcons(), 60);
</script>
